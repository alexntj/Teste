 name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and unzip project
        id: unzip
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP" ]; then echo "No zip found"; exit 1; fi
          echo "Found: $ZIP"
          mkdir -p work
          unzip -q "$ZIP" -d work
          # if zip contains a single top-level folder, descend into it
          ROOT=work
          COUNT=$(ls -A work | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -d "work/$(ls -A work)" ]; then
            ROOT="work/$(ls -A work)"
          fi
          echo "Project root: $ROOT"
          # sanity: must have settings.gradle or build.gradle
          if ! ls "$ROOT"/settings.gradle* "$ROOT"/build.gradle* >/dev/null 2>&1; then
            echo "No gradle files in $ROOT"; find "$ROOT" -maxdepth 2 -type f | head -50; exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ steps.unzip.outputs.root }}
        run: |
          chmod +x ./gradlew || true
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Collect APK
        run: |
          set -e
          ROOT="${{ steps.unzip.outputs.root }}"
          APK=$(find "$ROOT" -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          mkdir -p out
          cp "$APK" out/app-debug.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gameoverlay-debug-apk
          path: out/app-debug.apk
          if-no-files-found: error
